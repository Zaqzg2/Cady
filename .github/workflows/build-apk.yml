name: Build debug APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No `flutter create`, no Python patch scripts: native/ and the manifest are
      # just ordinary tracked source, so this step list is dramatically shorter
      # than the Flutter project's build-apk.yml.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.4

      # The sandbox this project was generated in has no network access, so it could not
      # download the real gradle-wrapper.jar binary. This step regenerates it for real,
      # using a genuine Gradle install with internet access — the same one-line fix you'd
      # run locally (`gradle wrapper`), just automated here.
      - name: Regenerate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.14.4 --distribution-type bin

      - name: Build debug APK
        id: build
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build-output.log
        continue-on-error: true

      - name: Collect failure logs
        if: steps.build.outcome == 'failure'
        run: |
          mkdir -p ci-failure-logs
          cp build-output.log ci-failure-logs/ 2>/dev/null || true
          [ -d app/build/reports ] && cp -r app/build/reports ci-failure-logs/app-build-reports

      - name: Upload failure logs
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: ci-failure-logs/

      - name: Upload debug APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cady-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
